server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: evops-base
  profiles:
    active: dev
  aop:
    proxy-target-class: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:file:./data/evops;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

evops:
  sensitive:
    # 敏感词库路径。classpath: 随包默认；生产改 file:/path/sensitive-words.txt，
    # 文件变更自动热更新（扫描前懒检查 mtime），或 POST /api/sensitive/words/reload 立即重载
    dict-path: classpath:sensitive-words.txt
  batch:
    # 批量后台任务记录保留天数：终态任务 expire_time = 完成时间 + 该天数，到期定时物理清理
    retain-days: 21
    # 到期清理执行时刻（每日）；默认凌晨 03:17，避开整点
    cleanup-cron: "0 17 3 * * ?"
  quota:
    # 额度预占占用时长（分钟）：超时由定时扫描自动归还
    hold-ttl-minutes: 40
    # 超时预占扫描间隔（毫秒）
    expire-scan-ms: 60000
    # 每日日结对平执行时刻；默认凌晨 03:47，避开整点与 03:17 任务清理
    recon-cron: "0 47 3 * * ?"

logging:
  level:
    com.evops: INFO
